<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anthropic dynamic workflows</title>
<style>
  :root {
    --bg: #0e121a;
    --fg: #d8dce4;
    --divider: #1d222d;

    --cool-fill: #1d3452;  --cool-stroke: #5a86b8;  --cool-text: #d1e2f5;
    --cool-sub: #7ba0c4;   --cool-glow: #7ba8d9;     --cool-packet: #9ecae8;

    --warm-fill: #3c2f17;  --warm-stroke: #e0a855;  --warm-text: #f5d898;
    --warm-sub: #c89a58;   --warm-glow: #ffbe6a;     --warm-packet: #ffcf85;

    --conn: #394455;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--fg);
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    overflow: hidden;
  }

  .app { display: grid; grid-template-rows: auto 1fr auto; height: 100vh; min-height: 560px; }

  header {
    padding: 12px 24px;
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid var(--divider);
  }
  .brand { font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #7a8192; }
  .brand b { color: #d8dce4; font-weight: 600; }
  .brand .sig { color: #5a6272; text-transform: none; letter-spacing: 0.02em; }

  .btn {
    height: 32px; padding: 0 16px;
    font: 11.5px ui-monospace, Menlo, monospace; letter-spacing: 0.04em;
    background: #161a22; border: 1px solid #262c38; color: #c2c8d4;
    cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
    transition: background .15s, border-color .15s, color .15s, box-shadow .15s;
  }
  .btn:hover:not([disabled]), .btn.hint:not([disabled]) { background: #1e2430; border-color: #394153; color: #fff; }
  .btn.hint:not([disabled]) { box-shadow: 0 0 0 3px rgba(255, 190, 106, 0.12); }
  .btn[disabled] { opacity: .45; cursor: not-allowed; }
  .btn .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--warm-glow); box-shadow: 0 0 6px var(--warm-glow); }

  main { position: relative; min-height: 0; display: grid; grid-template-rows: 1fr auto; padding: 8px 24px 6px; }
  .viz { position: relative; min-height: 0; display: flex; align-items: center; justify-content: center; }
  .viz svg { width: 100%; height: 100%; max-height: 100%; display: block; }

  .mini-log {
    height: 20px; margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font: 11px ui-monospace, Menlo, monospace; color: #93a0b4;
    letter-spacing: 0.01em; text-align: center;
  }

  /* nodes */
  .node .box { stroke-width: 1.4; transition: filter .25s, stroke .2s, stroke-width .2s; }
  .node.struct .box { fill: var(--cool-fill); stroke: var(--cool-stroke); }
  .node.agent  .box { fill: var(--warm-fill); stroke: var(--warm-stroke); }
  .node .lbl { font: 600 12px ui-monospace, Menlo, monospace; text-anchor: middle; letter-spacing: .01em; }
  .node.struct .lbl { fill: var(--cool-text); }
  .node.agent  .lbl { fill: var(--warm-text); }
  .node .sub { font: 9px ui-monospace, Menlo, monospace; text-anchor: middle; opacity: .82; }
  .node.struct .sub { fill: var(--cool-sub); }
  .node.agent  .sub { fill: var(--warm-sub); }
  .node.active.struct .box { filter: drop-shadow(0 0 7px var(--cool-glow)); stroke-width: 2; }
  .node.active.agent  .box { filter: drop-shadow(0 0 8px var(--warm-glow)); stroke-width: 2; }

  /* pipeline stage cells */
  .cell .cbox { fill: #141b27; stroke: #2f3c54; stroke-width: 1.1; transition: filter .2s, stroke .2s, fill .2s; }
  .cell.active .cbox { fill: var(--cool-fill); stroke: var(--cool-glow); filter: drop-shadow(0 0 6px var(--cool-glow)); }

  /* barrier bar (vertical) */
  .barrier .bbox { fill: #15202e; stroke: #3a4a63; stroke-width: 1.3; transition: filter .25s, stroke .25s, fill .25s; }
  .barrier .blbl { font: 10px ui-monospace, Menlo, monospace; fill: #6f8cb4; text-anchor: middle; letter-spacing: .1em; }
  .barrier.active .bbox { fill: var(--cool-fill); stroke: var(--cool-glow); filter: drop-shadow(0 0 9px var(--cool-glow)); }
  .barrier.active .blbl { fill: #bcd6f2; }

  /* connectors */
  .conn { stroke: var(--conn); stroke-width: 1.3; fill: none; }
  .conn.dashed { stroke-dasharray: 3 4; opacity: .55; }
  .lane { stroke: #232c3b; stroke-width: 1; stroke-dasharray: 2 5; }
  .arrow { fill: var(--conn); }
  .div { stroke: var(--divider); stroke-dasharray: 2 5; }

  /* band labels */
  .band-no  { font: 700 10px ui-monospace, Menlo, monospace; fill: #4d5566; letter-spacing: .12em; text-anchor: middle; }
  .band-ph  { font: 600 11px ui-monospace, Menlo, monospace; fill: #8a93a4; text-anchor: middle; }
  .band-pr  { font: 10px ui-monospace, Menlo, monospace; text-anchor: middle; }
  .band-pr.cool { fill: var(--cool-sub); }
  .band-pr.warm { fill: var(--warm-sub); }
  .note { font: italic 10px Georgia, serif; fill: #6b7689; text-anchor: middle; }
  .stage-h { font: 9px ui-monospace, Menlo, monospace; fill: #56657f; text-anchor: middle; }
  .item-h  { font: 8.5px ui-monospace, Menlo, monospace; fill: #56657f; text-anchor: end; }

  /* packets */
  .packet { r: 5; opacity: 0; transition: opacity .15s; pointer-events: none; }
  .packet.show { opacity: 1; }
  .packet.warm { fill: var(--warm-packet); filter: drop-shadow(0 0 5px var(--warm-packet)); }
  .packet.cool { fill: var(--cool-packet); filter: drop-shadow(0 0 5px var(--cool-packet)); }

  /* legend */
  .legend {
    border-top: 1px solid var(--divider); background: #0a0d14;
    padding: 11px 24px 13px;
    display: flex; gap: 26px; flex-wrap: wrap; justify-content: center; align-items: center;
  }
  .leg { display: flex; align-items: center; gap: 9px; font: 11px ui-monospace, Menlo, monospace; color: #8a93a4; }
  .leg code { color: #c2c8d4; }
  .leg .swatch { width: 26px; height: 14px; border-radius: 3px; flex: none; }
  .leg .sq-cool { background: var(--cool-fill); border: 1.4px solid var(--cool-stroke); }
  .leg .sq-warm { background: var(--warm-fill); border: 1.4px solid var(--warm-stroke); }
  .leg .dot-warm { width: 11px; height: 11px; border-radius: 50%; background: var(--warm-packet); box-shadow: 0 0 5px var(--warm-packet); }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">anthropic <b>dynamic workflows</b></div>
    <button class="btn" id="run"><span class="dot"></span>запустить</button>
  </header>

  <main>
    <div class="viz">
      <svg id="svg" viewBox="0 0 1200 460" preserveAspectRatio="xMidYMid meet">
        <!-- ════ vertical band dividers ════ -->
        <line class="div" x1="325" y1="70" x2="325" y2="408"/>
        <line class="div" x1="595" y1="70" x2="595" y2="408"/>
        <line class="div" x1="965" y1="70" x2="965" y2="408"/>

        <!-- ════ band labels (top) ════ -->
        <text class="band-no" x="178" y="34">01</text>
        <text class="band-ph" x="178" y="48">intake</text>
        <text class="band-pr warm" x="178" y="62">agent()</text>

        <text class="band-no" x="460" y="34">02</text>
        <text class="band-ph" x="460" y="48">review</text>
        <text class="band-pr warm" x="460" y="62">parallel()</text>

        <text class="band-no" x="780" y="34">03</text>
        <text class="band-ph" x="780" y="48">remediate</text>
        <text class="band-pr cool" x="780" y="62">pipeline()</text>

        <text class="band-no" x="1082" y="34">04</text>
        <text class="band-ph" x="1082" y="48">report</text>
        <text class="band-pr warm" x="1082" y="62">agent()</text>

        <!-- side notes -->
        <text class="note" x="520" y="392">⏸ ждём ВСЕ ветви</text>
        <text class="note" x="780" y="350">▶ независимый стриминг, без барьера</text>

        <!-- ════ connectors ════ -->
        <!-- intake spine -->
        <line class="conn" x1="24"  y1="230" x2="36"  y2="230"/>
        <path class="arrow" d="M 36 230 l -7 -4 l 0 8 z"/>
        <line class="conn" x1="164" y1="230" x2="175" y2="230"/>
        <path class="arrow" d="M 175 230 l -7 -4 l 0 8 z"/>
        <!-- triage → fan to 3 dims -->
        <path class="conn dashed" d="M 325 230 C 345 180, 350 130, 354 110"/>
        <line class="conn dashed" x1="325" y1="230" x2="354" y2="230"/>
        <path class="conn dashed" d="M 325 230 C 345 280, 350 330, 354 350"/>
        <!-- dims → barrier -->
        <line class="conn" x1="466" y1="110" x2="509" y2="110"/>
        <line class="conn" x1="466" y1="230" x2="509" y2="230"/>
        <line class="conn" x1="466" y1="350" x2="509" y2="350"/>
        <!-- barrier → pipeline entries -->
        <path class="conn dashed" d="M 531 230 C 555 200, 580 165, 600 160"/>
        <line class="conn dashed" x1="531" y1="230" x2="600" y2="230"/>
        <path class="conn dashed" d="M 531 230 C 555 260, 580 295, 600 300"/>
        <!-- lane guides -->
        <line class="lane" x1="600" y1="160" x2="935" y2="160"/>
        <line class="lane" x1="600" y1="230" x2="935" y2="230"/>
        <line class="lane" x1="600" y1="300" x2="935" y2="300"/>
        <!-- pipeline exits → synthesize -->
        <path class="conn dashed" d="M 935 160 C 980 175, 980 215, 960 230"/>
        <line class="conn dashed" x1="935" y1="230" x2="960" y2="230"/>
        <path class="conn dashed" d="M 935 300 C 980 285, 980 245, 960 230"/>
        <!-- synthesize → done -->
        <line class="conn" x1="1100" y1="230" x2="1120" y2="230"/>
        <path class="arrow" d="M 1120 230 l -7 -4 l 0 8 z"/>

        <!-- ════ nodes ════ -->
        <!-- 01 intake -->
        <g class="node struct" id="n-load" transform="translate(100 230)">
          <rect class="box" x="-64" y="-22" width="128" height="44" rx="6"/>
          <text class="lbl" y="-1">load_diff</text>
          <text class="sub" y="12">git · diff</text>
        </g>
        <g class="node agent" id="n-triage" transform="translate(250 230)">
          <rect class="box" x="-75" y="-22" width="150" height="44" rx="6"/>
          <text class="lbl" y="-1">agent.triage</text>
          <text class="sub" y="12">{schema} → 3 dims</text>
        </g>

        <!-- 02 review · parallel -->
        <g class="node agent" id="n-bugs" transform="translate(410 110)">
          <rect class="box" x="-56" y="-20" width="112" height="40" rx="6"/>
          <text class="lbl" y="-1">scan_bugs</text>
          <text class="sub" y="12">agent()</text>
        </g>
        <g class="node agent" id="n-perf" transform="translate(410 230)">
          <rect class="box" x="-56" y="-20" width="112" height="40" rx="6"/>
          <text class="lbl" y="-1">scan_perf</text>
          <text class="sub" y="12">agent()</text>
        </g>
        <g class="node agent" id="n-sec" transform="translate(410 350)">
          <rect class="box" x="-56" y="-20" width="112" height="40" rx="6"/>
          <text class="lbl" y="-1">scan_sec</text>
          <text class="sub" y="12">agent()</text>
        </g>
        <!-- barrier (vertical) -->
        <g class="barrier" id="bar" transform="translate(520 230)">
          <rect class="bbox" x="-11" y="-140" width="22" height="280" rx="5"/>
          <text class="blbl" transform="rotate(-90)" y="3">barrier · await all → findings[]</text>
        </g>

        <!-- 03 remediate · pipeline (3 lanes × 3 stages) -->
        <text class="stage-h" x="655" y="132">verify</text>
        <text class="stage-h" x="760" y="132">patch</text>
        <text class="stage-h" x="865" y="132">test</text>

        <g class="cell" id="cell-0-0"><rect class="cbox" x="611" y="143" width="88" height="34" rx="5"/></g>
        <g class="cell" id="cell-0-1"><rect class="cbox" x="716" y="143" width="88" height="34" rx="5"/></g>
        <g class="cell" id="cell-0-2"><rect class="cbox" x="821" y="143" width="88" height="34" rx="5"/></g>
        <g class="cell" id="cell-1-0"><rect class="cbox" x="611" y="213" width="88" height="34" rx="5"/></g>
        <g class="cell" id="cell-1-1"><rect class="cbox" x="716" y="213" width="88" height="34" rx="5"/></g>
        <g class="cell" id="cell-1-2"><rect class="cbox" x="821" y="213" width="88" height="34" rx="5"/></g>
        <g class="cell" id="cell-2-0"><rect class="cbox" x="611" y="283" width="88" height="34" rx="5"/></g>
        <g class="cell" id="cell-2-1"><rect class="cbox" x="716" y="283" width="88" height="34" rx="5"/></g>
        <g class="cell" id="cell-2-2"><rect class="cbox" x="821" y="283" width="88" height="34" rx="5"/></g>

        <text class="item-h" x="606" y="163">#1</text>
        <text class="item-h" x="606" y="233">#2</text>
        <text class="item-h" x="606" y="303">#3</text>

        <!-- 04 report -->
        <g class="node agent" id="n-synth" transform="translate(1030 230)">
          <rect class="box" x="-70" y="-22" width="140" height="44" rx="6"/>
          <text class="lbl" y="-1">agent.synth</text>
          <text class="sub" y="12">собирает отчёт</text>
        </g>
        <g class="node struct" id="n-done" transform="translate(1155 230)">
          <rect class="box" x="-35" y="-17" width="70" height="34" rx="6"/>
          <text class="lbl" y="3">done</text>
        </g>

        <!-- ════ packets ════ -->
        <circle class="packet" id="p0" cx="30" cy="230"/>
        <circle class="packet" id="p1" cx="30" cy="230"/>
        <circle class="packet" id="p2" cx="30" cy="230"/>
        <circle class="packet" id="p3" cx="30" cy="230"/>
      </svg>
    </div>
    <div class="mini-log" id="log">&nbsp;</div>
  </main>

  <div class="legend">
    <div class="leg"><span class="swatch sq-warm"></span><span><code>agent()</code> — узел-агент (LLM)</span></div>
    <div class="leg"><span class="swatch sq-cool"></span><span>структура оркестратора</span></div>
    <div class="leg"><span class="dot-warm"></span><span>данные между шагами</span></div>
    <div class="leg"><span>⏸ <code>parallel()</code> — веер + <b>барьер</b>: ждём все ветви</span></div>
    <div class="leg"><span>▶ <code>pipeline()</code> — <b>стриминг</b> по стадиям, без барьера</span></div>
  </div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const sleep = (ms) => new Promise(r => setTimeout(r, ms));

  function tween(dur, onStep) {
    return new Promise((resolve) => {
      const start = performance.now();
      const frame = (now) => {
        const t = Math.min(1, (now - start) / dur);
        const e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
        onStep(e);
        if (t < 1) requestAnimationFrame(frame); else resolve();
      };
      requestAnimationFrame(frame);
    });
  }

  function setPos(p, x, y) { const el = p.el; el.setAttribute('cx', x); el.setAttribute('cy', y); p.x = x; p.y = y; }
  function show(p, kind) { p.el.setAttribute('class', 'packet ' + kind + ' show'); }
  function hide(p) { p.el.classList.remove('show'); }
  async function moveTo(p, x, y, dur) {
    const sx = p.x, sy = p.y;
    await tween(dur, (e) => setPos(p, sx + (x - sx) * e, sy + (y - sy) * e));
  }

  const on  = (id) => $(id).classList.add('active');
  const off = (id) => $(id).classList.remove('active');
  const setLog = (t) => { $('log').textContent = t || ' '; };

  const NODES = ['n-load','n-triage','n-bugs','n-perf','n-sec','n-synth','n-done','bar'];
  const CELLS = [];
  for (let i = 0; i < 3; i++) for (let s = 0; s < 3; s++) CELLS.push('cell-' + i + '-' + s);

  function reset() {
    [...NODES, ...CELLS].forEach(off);
    ['p0','p1','p2','p3'].forEach(id => { const el = $(id); el.classList.remove('show'); el.setAttribute('cx', 30); el.setAttribute('cy', 230); });
    setLog('');
  }
  const mk = (id) => ({ el: $(id), x: 30, y: 230 });

  // ───── 02 · parallel branch (one dimension agent → parks at the vertical barrier) ─────
  let arrived = 0;
  async function branch(p, nodeId, ny, startDelay, travel) {
    setPos(p, 325, 230); show(p, 'warm');     // start at triage's right edge
    await sleep(startDelay);
    await moveTo(p, 410, ny, travel);
    on(nodeId);
    await sleep(220);
    await moveTo(p, 509, ny, travel * 0.85);  // slide right onto the barrier line and PARK
    arrived++;
    if (arrived === 2) setLog('⏸ barrier — 2 ветви готовы, ждём scan_sec…');
  }

  // ───── 03 · one pipeline item streaming left→right through its 3 stages ─────
  async function item(p, lane, y, startDelay, stageDur) {
    setPos(p, 600, y); show(p, 'warm');
    await sleep(startDelay);
    const X = [655, 760, 865];
    for (let s = 0; s < 3; s++) {
      await moveTo(p, X[s], y, stageDur);
      on('cell-' + lane + '-' + s);
      await sleep(110);
      off('cell-' + lane + '-' + s);
    }
    await moveTo(p, 935, y, stageDur * 0.8);
    hide(p);
    if (lane === 0) setLog('↳ item#1 done — а item#3 ещё в verify (барьера нет)');
  }

  async function run() {
    reset();
    const P = { p0: mk('p0'), p1: mk('p1'), p2: mk('p2'), p3: mk('p3') };

    // ── 01 · intake (линейная цепочка) ──
    setLog('phase("intake")');
    show(P.p0, 'warm'); setPos(P.p0, 30, 230);
    await moveTo(P.p0, 100, 230, 380); on('n-load'); setLog('» load_diff() · читаем git diff'); await sleep(280); off('n-load');
    await moveTo(P.p0, 250, 230, 380); on('n-triage'); setLog('» agent.triage(diff) → размечает 3 измерения'); await sleep(360); off('n-triage');

    // ── 02 · review (parallel → BARRIER) ──
    setLog('parallel([scan_bugs, scan_perf, scan_sec]) — веер');
    arrived = 0;
    await Promise.all([                         // Promise.all == барьер: ждём ВСЕ ветви
      branch(P.p0, 'n-bugs', 110, 0,   620),
      branch(P.p1, 'n-perf', 230, 120,  760),
      branch(P.p2, 'n-sec',  350, 240, 1180),   // самая медленная — приходит последней
    ]);
    on('bar'); setLog('■ barrier passed — собрали findings[] из всех веток'); await sleep(520);
    [P.p0, P.p1, P.p2].forEach(hide); off('n-bugs'); off('n-perf'); off('n-sec');

    // эмитим один пакет вправо из барьера
    setPos(P.p0, 531, 230); show(P.p0, 'cool');
    await moveTo(P.p0, 600, 230, 220); hide(P.p0); off('bar');

    // ── 03 · remediate (pipeline → СТРИМИНГ, без барьера) ──
    setLog('pipeline(items, verify → patch → test) — стриминг');
    await Promise.all([                         // старты и скорости разные → элементы идут вразнобой
      item(P.p0, 0, 160, 0,   360),             // #1 быстрый, стартует первым → выходит раньше всех
      item(P.p1, 1, 230, 280, 560),
      item(P.p2, 2, 300, 520, 480),             // #3 стартует последним → ещё в начале, когда #1 уже вышел
    ]);

    // ── 04 · report (линейная сборка) ──
    setLog('phase("report")');
    setPos(P.p0, 935, 230); show(P.p0, 'warm');
    await moveTo(P.p0, 1030, 230, 520); on('n-synth'); setLog('» agent.synth(patched) → финальный отчёт'); await sleep(340); off('n-synth');
    await moveTo(P.p0, 1120, 230, 360); on('n-done'); hide(P.p0);
    setLog('ok · workflow готов');
  }

  // ───── run guard + hint pulse ─────
  let running = false;
  $('run').addEventListener('click', async () => {
    if (running) return;
    running = true; $('run').disabled = true; stopHint();
    try { await run(); } finally { running = false; $('run').disabled = false; }
  });

  let hintStopped = false, hintTimer = null, hintOn = false;
  function hintTick() {
    if (hintStopped) return;
    hintOn = !hintOn;
    $('run').classList.toggle('hint', hintOn);
    hintTimer = setTimeout(hintTick, 800);
  }
  function stopHint() {
    if (hintStopped) return;
    hintStopped = true; if (hintTimer) clearTimeout(hintTimer);
    $('run').classList.remove('hint');
  }
  $('run').addEventListener('mouseenter', stopHint, { once: true });
  setTimeout(hintTick, 700);
})();
</script>
</body>
</html>
