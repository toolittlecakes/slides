<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI-native SDLC. Грабли, на которые почти все наступают</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="image" href="./assets/template-face.svg">
  <link rel="preload" as="image" href="./assets/template-end-back.svg">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['Manrope', 'sans-serif'],
            body: ['Manrope', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            bg: '#f8fafc',
            surface: '#ffffff',
            border: '#d7dce5',
            accent: '#d94f32',
            muted: '#526071',
            dim: '#7a8493',
          },
          boxShadow: {
            glow: '0 18px 42px rgba(15, 23, 42, 0.12)',
          }
        }
      }
    };
  </script>

  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.7/babel.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #root { width: 100vw; height: 100vh; overflow: hidden; background: #f8fafc; }
    body {
      font-family: 'Manrope', sans-serif;
      color: #111827;
      -webkit-font-smoothing: antialiased;
      font-variant-numeric: lining-nums;
      font-feature-settings: "lnum" 1;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(248, 250, 252, 0.96)),
        #f8fafc;
    }

    .font-display {
      font-variant-numeric: lining-nums;
      font-feature-settings: "lnum" 1;
    }

    .font-mono,
    .slide-counter,
    ol.slide-ol > li::before {
      font-variant-numeric: lining-nums tabular-nums;
      font-feature-settings: "lnum" 1, "tnum" 1;
    }

    .stage {
      position: fixed;
      inset: 0;
      background: #f8fafc;
      overflow: hidden;
    }
    .slide-frame {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1280px;
      height: 720px;
      transform: translate(-50%, -50%) scale(var(--slide-scale, 1));
      transform-origin: center center;
    }

    .slide-enter { animation: slideIn 0.38s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px) scale(0.992); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .glass {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid #d7dce5;
      box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10);
    }

    .accent-line {
      width: 58px;
      height: 3px;
      border-radius: 999px;
      background: linear-gradient(90deg, #d94f32, #f07c5f);
    }

    ul.slide-list > li {
      position: relative;
      padding-left: 1.45rem;
    }
    ul.slide-list > li::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0.65em;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #d94f32;
      box-shadow: 0 0 0 4px rgba(217, 79, 50, 0.14);
    }

    ul.slide-list-sm > li {
      position: relative;
      padding-left: 1.1rem;
    }
    ul.slide-list-sm > li::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0.6em;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #d94f32;
      box-shadow: 0 0 0 3px rgba(217, 79, 50, 0.12);
    }

    ol.slide-ol {
      list-style: none;
      counter-reset: step;
    }
    ol.slide-ol > li {
      counter-increment: step;
      position: relative;
      padding-left: 2.7rem;
    }
    ol.slide-ol > li::before {
      content: counter(step);
      position: absolute;
      left: 0;
      top: -0.05em;
      font-family: 'Manrope', sans-serif;
      font-size: 1.15em;
      font-weight: 700;
      color: #d94f32;
    }

    ol.slide-ol-from-5 { counter-reset: step 4; }
    ol.slide-ol-from-5 > li::before { content: counter(step); }

    .speaker-layout {
      width: 100%;
      display: flex;
      align-items: stretch;
      gap: 3.5rem;
    }
    .speaker-layout-main {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .speaker-photo-wrap {
      flex: 0 0 260px;
      margin-left: auto;
    }
    .speaker-photo-wrap img {
      width: 100%;
      height: auto;
      max-width: 260px;
    }

    @media (max-width: 1200px) {
      .speaker-layout { gap: 2rem; }
      .speaker-photo-wrap { flex-basis: 220px; }
      .speaker-photo-wrap img { max-width: 220px; }
    }

    @page {
      size: 16in 9in;
      margin: 0;
    }
    @media print {
      html, body, #root {
        width: auto;
        height: auto;
        overflow: visible;
        background: #f8fafc !important;
      }
      body {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
        color-adjust: exact;
      }
      * {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .glass {
        background: #ffffff !important;
        border: 1px solid #d7dce5 !important;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
      }
      .screen-only { display: none !important; }
      .print-only { display: block !important; }
      .print-slide {
        width: 100vw;
        height: 100vh;
        min-height: 100vh;
        page-break-after: always;
        break-after: page;
        overflow: hidden;
        background: #f8fafc !important;
      }
      .print-slide-content,
      .print-slide-content > * {
        width: 100% !important;
        height: 100% !important;
      }
      .print-slide:last-child {
        page-break-after: avoid;
        break-after: avoid;
      }
    }
    @media screen {
      .print-only { display: none !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    function Slide({ children, className = '', contentClassName = '', align = 'center', background = null }) {
      return (
        <div className={`relative overflow-hidden w-full h-full px-48 py-12 flex flex-col ${align === 'start' ? 'justify-start' : 'justify-center'} ${className}`}>
          {background}
          <div className={`relative z-10 w-full max-w-[1152px] mx-auto ${contentClassName}`}>
            {children}
          </div>
        </div>
      );
    }

    function SlideTemplateBackground({ src }) {
      return (
        <img
          src={src}
          alt=""
          aria-hidden="true"
          className="absolute inset-0 z-0 h-full w-full object-cover pointer-events-none select-none"
        />
      );
    }

    function TitleSlide({ title, subtitle }) {
      return (
        <Slide className="items-center text-center">
          <div className="w-full flex flex-col items-center">
            <h1 className="font-display text-6xl font-800 tracking-tight leading-tight max-w-5xl">
              {title}
            </h1>
            {subtitle && (
              <p className="font-body text-2xl text-muted mt-8 max-w-4xl leading-relaxed">
                {subtitle}
              </p>
            )}
          </div>
        </Slide>
      );
    }

    function H2({ children }) {
      return (
        <div className="mb-9 max-w-5xl mx-auto w-full">
          <h2 className="font-display text-5xl font-700 tracking-tight leading-tight">{children}</h2>
        </div>
      );
    }

    function H3({ children }) {
      return (
        <h3 className="font-display text-3xl font-700 tracking-tight mb-5 max-w-5xl mx-auto w-full">{children}</h3>
      );
    }

    function HistoricalTimeline({ active }) {
      const steps = [
        { month: 'Июль', year: '2025' },
        { month: 'Август', year: '2025' },
        { month: 'Декабрь', year: '2025' },
        { month: 'Март', year: '2026' },
      ];
      const pct = (active / (steps.length - 1)) * 100;
      return (
        <div className="absolute left-48 right-48 bottom-4 h-12">
          <div className="relative h-full">
            <div className="absolute left-[6px] right-[6px] top-[6px] h-[2px] bg-border" />
            <div className="absolute left-[6px] top-[6px] h-[2px] bg-accent transition-all duration-500" style={{ width: `calc((100% - 12px) * ${pct / 100})` }} />
            <div className="relative z-10 flex w-full justify-between">
              {steps.map((step, i) => (
                <div key={`${step.month}-${step.year}`} className="flex flex-col items-center gap-1.5">
                  <div className={`h-3 w-3 rounded-full border-2 ${i <= active ? 'border-accent bg-accent shadow-[0_0_0_5px_rgba(217,79,50,0.16)]' : 'border-border bg-bg'}`} />
                  <span className={`font-mono text-xs leading-none ${i <= active ? 'text-[#111827]' : 'text-dim'}`}>{step.month}</span>
                  <span className={`font-mono text-[10px] leading-none ${i <= active ? 'text-[#111827]' : 'text-dim'}`}>{step.year}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    function Panel({ children, className = '' }) {
      return (
        <div className={`glass rounded-2xl p-8 ${className}`}>
          {children}
        </div>
      );
    }

    function SmallPanel({ children, className = '' }) {
      return (
        <div className={`glass rounded-xl p-5 ${className}`}>
          {children}
        </div>
      );
    }

    function Solution({ children }) {
      const [open, setOpen] = useState(false);
      return (
        <div className="glass rounded-2xl mt-6 overflow-hidden transition-all" data-solution-open={open ? 'true' : 'false'}>
          <button
            onClick={() => setOpen(o => !o)}
            className="w-full flex items-center justify-between gap-4 px-8 py-5 text-left hover:bg-[#edf7f0] transition-colors"
          >
            <span className="font-display text-lg text-[#1f7a42]">Решение</span>
            <span className={`font-mono text-xl text-[#1f7a42] transition-transform ${open ? 'rotate-45' : ''}`}>+</span>
          </button>
          <div className={`grid transition-all duration-300 ease-out ${open ? 'grid-rows-[1fr] opacity-100' : 'grid-rows-[0fr] opacity-0'}`}>
            <div className="overflow-hidden">
              <div className="px-8 pb-7 font-body text-xl text-[#111827] leading-relaxed">
                {children}
              </div>
            </div>
          </div>
        </div>
      );
    }

    function TrendSlide({ active, items, children }) {
      return (
        <Slide align="start" contentClassName="pt-8">
          <HistoricalTimeline active={active} />
          <H2>Тренды прошлого</H2>
          <div className="grid grid-cols-[0.58fr_1.42fr] gap-8 max-w-6xl mx-auto w-full items-start">
            <ol className="slide-ol space-y-5 font-body text-xl text-[#111827] leading-snug">
              {items.map((item, i) => (
                <li key={item} className={i === items.length - 1 ? 'font-700 text-[#111827]' : 'text-muted'}>
                  {item}
                </li>
              ))}
            </ol>
            <div className="flex items-start justify-center min-h-[420px] max-h-[420px]">
              {children}
            </div>
          </div>
        </Slide>
      );
    }

    function FigureLink({ href, children }) {
      return (
        <a href={href} target="_blank" rel="noopener noreferrer" className="mt-3 block text-center font-mono text-sm text-dim hover:text-accent transition-colors">
          {children}
        </a>
      );
    }

    function ProgressBar({ current, total }) {
      const pct = ((current + 1) / total) * 100;
      return (
        <div className="fixed bottom-0 left-0 w-full h-[2px] bg-border z-50">
          <div className="h-full bg-accent transition-all duration-500 ease-out" style={{ width: `${pct}%` }} />
        </div>
      );
    }

    function SlideChrome({ current, total, mode = 'screen' }) {
      const showQr = current !== 0 && current !== total - 1;
      const rootClass = mode === 'print'
        ? 'absolute bottom-5 right-8 z-50 flex flex-col items-center gap-2'
        : 'fixed bottom-5 right-8 z-50 flex flex-col items-center gap-2';

      return (
        <div className={rootClass}>
          {showQr && (
            <a
              href="https://slides.grably.tech/agentic_dev_conf/"
              target="_blank"
              rel="noopener noreferrer"
              className="block rounded-md border border-border bg-white p-0.5 shadow-glow"
              aria-label="Презентация со ссылками"
            >
              <img src="./assets/qr.png" alt="QR code" className="h-28 w-28 object-contain" />
            </a>
          )}
          <div className="font-mono text-base leading-none text-dim select-none">
            {String(current + 1).padStart(2, '0')}<span className="text-border mx-1">/</span>{String(total).padStart(2, '0')}
          </div>
        </div>
      );
    }

    const slides = [
      // 1. Speaker intro
      () => (
        <Slide className="bg-black text-white" contentClassName="max-w-[1110px]" background={<SlideTemplateBackground src="./assets/template-face.svg" />}>
          <div className="grid grid-cols-[minmax(0,640px)_250px] items-stretch justify-between gap-12">
            <div className="flex flex-col justify-between">
              <h1 className="font-display text-5xl font-800 tracking-tight leading-tight max-w-5xl">
                AI-native SDLC:<br/>
                Грабли, на которые почти все наступают
              </h1>
              <div className="-translate-y-6">
                <p className="font-display text-3xl font-700 tracking-tight text-white/88 mb-5">
                  Николай Шейко
                </p>
                <ul className="slide-list space-y-4 font-body text-xl text-white/86 leading-relaxed max-w-4xl">
                  <li>Кастомная ИИ разработка: <a href="https://grably.tech" target="_blank" rel="noopener noreferrer" className="text-[#45a3ff] font-mono hover:text-white transition-colors">grably.tech</a></li>
                  <li>Топовые онлайн конфы по ИИ: <a href="https://entropy.talk" target="_blank" rel="noopener noreferrer" className="text-[#45a3ff] font-mono hover:text-white transition-colors">entropy.talk</a></li>
                  <li>Курс по агентам: <a href="https://aiforwork.courses" target="_blank" rel="noopener noreferrer" className="text-[#45a3ff] font-mono hover:text-white transition-colors">aiforwork.courses</a></li>
                </ul>
              </div>
            </div>
            <div className="justify-self-end w-[250px]">
              <img
                src="./assets/nikolay-sheyko-avatar.jpg"
                alt="Николай Шейко"
                className="block !max-w-[250px] rounded-2xl border border-white/20 shadow-[0_24px_70px_rgba(0,0,0,0.45)]"
              />
              <a href="https://t.me/ai_grably" target="_blank" rel="noopener noreferrer" className="flex items-center gap-3 mt-4 px-4 py-3 rounded-2xl border border-white/15 bg-white/95 hover:border-[#45a3ff]/50 hover:bg-white transition-all">
                <div className="w-10 h-10 rounded-full border border-border bg-white overflow-hidden flex-shrink-0">
                  <img src="./assets/oestick-avatar.jpg" alt="" className="w-full h-full object-cover" />
                </div>
                <div className="min-w-0">
                  <p className="font-body text-sm font-700 text-[#111827]">AI и грабли</p>
                  <p className="font-mono text-xs text-dim truncate">t.me/ai_grably</p>
                </div>
                <div className="ml-auto w-9 h-9 rounded-full border border-accent/30 bg-[#fff3ee] flex items-center justify-center flex-shrink-0">
                  <svg viewBox="0 0 24 24" className="w-[18px] h-[18px] fill-accent">
                    <path d="M9.04 15.47 8.7 20.3c.49 0 .7-.21.95-.46l2.28-2.18 4.72 3.46c.86.48 1.47.23 1.7-.8l3.08-14.45v-.01c.29-1.29-.47-1.8-1.3-1.5L1.96 9.02c-1.25.49-1.23 1.19-.22 1.5l4.71 1.47L17.4 5.2c.52-.34 1-.15.6.2L9.04 15.47Z" />
                  </svg>
                </div>
              </a>
            </div>
          </div>
        </Slide>
      ),

      // 2. План
      () => (
        <Slide>
          <H2>План</H2>
          <ol className="slide-ol grid grid-cols-2 gap-5 font-body text-3xl text-[#111827] max-w-6xl mx-auto w-full leading-snug">
            <li><Panel className="h-full">что уже происходит с SDLC</Panel></li>
            <li><Panel className="h-full">топ ошибок при внедрении ИИ</Panel></li>
            <li><Panel className="h-full">лайфхаки и best-practices</Panel></li>
            <li><Panel className="h-full">что ждет завтра (и как готовиться)</Panel></li>
          </ol>
        </Slide>
      ),

      // 3. Тренды прошлого: METR
      () => (
        <TrendSlide active={0} items={['METR: ощущения ускорения 20%, реальность -20%']}>
          <figure className="w-full">
            <img src="./assets/metr-core-result.png" alt="METR core result" className="w-full max-h-[420px] object-contain rounded-xl" />
            <FigureLink href="https://arxiv.org/pdf/2507.09089">METR, июль 2025</FigureLink>
          </figure>
        </TrendSlide>
      ),

      // 4. Тренды прошлого: SWEPR
      () => (
        <TrendSlide active={1} items={[
          'METR: ощущения ускорения 20%, реальность -20%',
          'SWEPR: ускорение есть и разрыв растет',
        ]}>
          <figure className="w-full">
            <img src="./assets/swepr-productivity.png" alt="SWEPR productivity" className="w-full max-h-[420px] object-contain rounded-xl" />
            <FigureLink href="https://aiconference.com/wp-content/uploads/2025/09/Yegor-Denisov-Blanch-Will-AI-Replace-Software-Engineers_-.pptx.pdf">SWEPR / Stanford, август 2025</FigureLink>
          </figure>
        </TrendSlide>
      ),

      // 5. Тренды прошлого: агенты заработали
      () => (
        <TrendSlide active={2} items={[
          'METR: ощущения ускорения 20%, реальность -20%',
          'SWEPR: ускорение есть и разрыв растет',
          'Karpathy: Агенты заработали',
        ]}>
          <figure className="w-full">
            <img src="./assets/dec-karpaty-twit.png" alt="Karpathy December tweet" className="w-full max-h-[420px] object-contain rounded-xl" />
            <FigureLink href="https://x.com/karpathy/status/2026731645169185220">Karpathy про декабрь 2025</FigureLink>
          </figure>
        </TrendSlide>
      ),

      // 6. Тренды прошлого: SDLC is dead
      () => (
        <TrendSlide active={3} items={[
          'METR: ощущения ускорения 20%, реальность -20%',
          'SWEPR: ускорение есть и разрыв растет',
          'Karpathy: Агенты заработали',
          'Boris Tane: SDLC мертв',
        ]}>
          <figure className="w-full">
            <img src="./assets/sdlc-comparison.png" alt="SDLC before and after AI comparison" className="w-full max-h-[420px] object-contain rounded-xl" />
            <FigureLink href="https://boristane.com/blog/the-software-development-lifecycle-is-dead/">Boris Tane: The Software Development Lifecycle is Dead</FigureLink>
          </figure>
        </TrendSlide>
      ),

      // 7. Тренды прошлого: Review Curse
      () => (
        <TrendSlide active={3} items={[
          'METR: ощущения ускорения 20%, реальность -20%',
          'SWEPR: ускорение есть и разрыв растет',
          'Karpathy: Агенты заработали',
          'Boris Tane: SDLC мертв',
          'Review - главный bottleneck',
        ]}>
          <figure className="w-full">
            <img src="./assets/sdlc3.png" alt="SDLC Review Curse" className="w-full max-h-[400px] object-contain rounded-xl" />
            <FigureLink href="https://boristane.com/blog/the-software-development-lifecycle-is-dead/">Boris Tane: Review Curse</FigureLink>
          </figure>
        </TrendSlide>
      ),

      // 8. Распределение времени
      () => (
        <Slide contentClassName="flex flex-col items-center text-center">
          <h2 className="font-display text-5xl font-700 tracking-tight leading-tight mb-9">Распределение времени</h2>
          <img src="./assets/time-distribution.png" alt="Time distribution" className="w-full max-w-5xl max-h-[500px] object-contain rounded-xl mx-auto" />
        </Slide>
      ),

      // 10. Суммируем
      () => (
        <Slide>
          <H2>Суммируем</H2>
          <div className="grid grid-cols-3 gap-5 max-w-6xl mx-auto w-full">
            <Panel className="p-7">
              <p className="font-body text-3xl leading-tight text-[#111827]">Проблемы с оценкой эффективности</p>
            </Panel>
            <Panel className="p-7">
              <p className="font-body text-3xl leading-tight text-[#111827]">Объективно - результат был даже летом 2025</p>
            </Panel>
            <Panel className="p-7">
              <p className="font-body text-3xl leading-tight text-[#111827]">Схлопывание этапов разработки</p>
            </Panel>
          </div>
        </Slide>
      ),

      // 11. Ошибка 1. Работа в синхронном режиме
      () => (
        <Slide contentClassName="flex flex-col items-center text-center">
          <h2 className="font-display text-5xl font-700 tracking-tight leading-tight mb-8">Ошибка 1. Работа в синхронном режиме</h2>
          <div className="grid grid-cols-[1fr_auto_1fr] gap-6 items-stretch max-w-6xl w-full">
            <Panel className="p-7 text-left">
              <p className="font-display text-3xl font-700 text-[#111827] mb-2">Developer mode</p>
              <p className="font-mono text-xl text-muted mb-6">CPU-bound</p>
              <p className="font-body text-3xl leading-tight text-[#111827]">Developer</p>
            </Panel>
            <div className="flex items-center justify-center">

    function getInitialSlide() {
      const p = new URLSearchParams(window.location.search);
      const s = parseInt(p.get('slide'), 10);
      return (!isNaN(s) && s >= 0) ? Math.min(s, slides.length - 1) : 0;
    }

    function syncURL(n) {
      const url = new URL(window.location);
      url.searchParams.set('slide', n);
      window.history.replaceState(null, '', url);
    }

    function App() {
      const [current, setCurrent] = useState(getInitialSlide);
      const [animKey, setAnimKey] = useState(0);
      const total = slides.length;

      const revealNextSolution = useCallback(() => {
        const solution = document.querySelector('.slide-frame [data-solution-open="false"] button');
        if (!solution) return false;
        solution.click();
        return true;
      }, []);

      const go = useCallback((dir) => {
        setCurrent(prev => {
          const next = prev + dir;
          if (next < 0 || next >= total) return prev;
          syncURL(next);
          return next;
        });
        setAnimKey(k => k + 1);
      }, [total]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ' || e.key === 'PageDown') {
            e.preventDefault();
            if (revealNextSolution()) return;
            go(1);
          }
          if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'PageUp') {
            e.preventDefault();
            go(-1);
          }
          if (e.key === 'Home') {
            setCurrent(0);
            syncURL(0);
            setAnimKey(k => k + 1);
          }
          if (e.key === 'End') {
            setCurrent(total - 1);
            syncURL(total - 1);
            setAnimKey(k => k + 1);
          }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [go, revealNextSolution, total]);

      useEffect(() => {
        let startX = 0;
        const onTouchStart = (e) => { startX = e.touches[0].clientX; };
        const onTouchEnd = (e) => {
          const diff = startX - e.changedTouches[0].clientX;
          if (Math.abs(diff) > 60) go(diff > 0 ? 1 : -1);
        };
        window.addEventListener('touchstart', onTouchStart, { passive: true });
        window.addEventListener('touchend', onTouchEnd, { passive: true });
        return () => {
          window.removeEventListener('touchstart', onTouchStart);
          window.removeEventListener('touchend', onTouchEnd);
        };
      }, [go]);

      useEffect(() => {
        const update = () => {
          const s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
          document.documentElement.style.setProperty('--slide-scale', s);
        };
        update();
        window.addEventListener('resize', update);
        window.addEventListener('orientationchange', update);
        return () => {
          window.removeEventListener('resize', update);
          window.removeEventListener('orientationchange', update);
        };
      }, []);

      const CurrentSlide = slides[current];

      return (
        <>
          <div className="stage screen-only">
            <div className="slide-frame">
              <div key={animKey} className="w-full h-full slide-enter">
                <CurrentSlide />
              </div>
            </div>
            <ProgressBar current={current} total={total} />
            <SlideChrome current={current} total={total} mode="screen" />
          </div>

          <div className="print-only bg-bg">
            {slides.map((S, i) => (
              <div key={i} className="print-slide relative">
                <div className="print-slide-content">
                  <S />
                </div>
                <SlideChrome current={i} total={total} mode="print" />
              </div>
            ))}
          </div>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
